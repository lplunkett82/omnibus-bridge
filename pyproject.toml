[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnibus-bridge"
version = "0.0.1"
description = "Python asyncio daemon bridging a Leviton 117A00-1 Omni-Bus Interface Translator to Home Assistant via MQTT."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lynden Plunkett" }]
dependencies = [
    "cryptography>=42",
    "paho-mqtt>=2",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
omnibus-bridge = "omnibus_bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibus_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
